name: Test on Main Branch

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    

jobs:
  test-nettest-main:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: x86_64-unknown-linux-gnu
        override: true
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev netstat-nat
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build nettest
      run: |
        cargo build --release --target x86_64-unknown-linux-gnu
        echo "Build completed successfully"

    - name: Run unit tests
      run: |
        cargo test --lib --target x86_64-unknown-linux-gnu
        echo "Unit tests completed successfully"
        
    - name: Prepare test environment
      run: |
        mkdir -p test-run
        cp target/x86_64-unknown-linux-gnu/release/nettest test-run/
        cd test-run
        chmod +x nettest
        
        # Создаем локальный конфиг для тестов
        cat > nettest.conf << 'EOF'
        # Nettest Configuration File for CI/CD
        server_tcp_port = 5005
        client_use_tls = false
        client_use_websocket = false
        x_nettest_client = "nt"
        control_server = "https://api.nettest.org"
        client_uuid = "ee7760ec-db94-43df-b8dc-001384f0ed40"
        EOF
        
        echo "Test environment prepared"
        echo "Current directory: $(pwd)"
        echo "Binary exists: $(ls -la nettest)"
        echo "Local config created:"
        cat nettest.conf
        
    - name: Create system config file
      run: |
        # Создаем системный конфиг файл с правами sudo
        sudo mkdir -p /etc
        sudo tee /etc/nettest.conf > /dev/null << 'EOF'
        # Nettest Configuration File for CI/CD
        server_tcp_port = 5005
        client_use_tls = false
        client_use_websocket = false
        x_nettest_client = "nt"
        control_server = "https://api.nettest.org"
        client_uuid = "ee7760ec-db94-43df-b8dc-001384f0ed40"
        EOF
        
        echo "System config file created at /etc/nettest.conf"
        echo "System config content:"
        sudo cat /etc/nettest.conf

    - name: Create TLS certificates
      run: |
        cd test-run
        
        # Создаем TLS сертификаты из секретов
        echo "${{ secrets.fullchain }}" > fullchain.pem
        echo "${{ secrets.privkey }}" > privkey.pem
        
        # Проверяем права доступа
        chmod 600 privkey.pem
        chmod 644 fullchain.pem
        
        echo "TLS certificates created:"
        ls -la *.pem
        
        # Выводим содержимое сертификатов для отладки
        echo "=== FULLCHAIN CERTIFICATE ==="
        cat fullchain.pem
        echo "=== END FULLCHAIN ==="
        
        echo "=== PRIVATE KEY (first 100 chars) ==="
        head -c 100 privkey.pem
        echo "..."
        echo "=== END PRIVATE KEY PREVIEW ==="
        
        
    - name: Start nettest server
      run: |
        cd test-run
        
        echo "Starting nettest server with TLS and sudo for port 443..."
        sudo nohup ./nettest -s -k privkey.pem -c fullchain.pem > server.log 2>&1 &
        echo "TLS server started in background with sudo"
        
        sleep 3
        
        if pgrep -f "nettest -s" >/dev/null 2>&1; then
          echo "✅ TLS Server is running"
        else
          echo "❌ TLS Server failed to start"
          cat server.log
          exit 1
        fi
        
        if netstat -tuln 2>/dev/null | grep :5005 >/dev/null 2>&1; then
          echo "✅ Port 5005 is listening"
        else
          echo "❌ Port 5005 is not listening"
          cat server.log
          exit 1
        fi
        
        if netstat -tuln 2>/dev/null | grep :443 >/dev/null 2>&1; then
          echo "✅ Port 443 is listening"
        else
          echo "❌ Port 443 is not listening"
          cat server.log
          exit 1
        fi
              

        
    - name: Run nettest client TCP test
      run: |
        cd test-run
        
        echo "Running nettest client test with TCP and -save..."
        echo "Client command: ./nettest -c 127.0.0.1 -save -git-hash ${{ github.sha }}"
        
        timeout 60s ./nettest -c 127.0.0.1 -save -git-hash "${{ github.sha }}"
        CLIENT_EXIT_CODE=$?
        
        echo "Client test completed"
        echo "Client exit code: $CLIENT_EXIT_CODE"
        
        if [ $CLIENT_EXIT_CODE -ne 0 ]; then
          echo "❌ Client TCP test failed"
          exit 1
        fi
        
        echo "✅ Client TCP test completed successfully"

    - name: Run nettest client TLS test
      run: |
        cd test-run
        
        echo "Running nettest client test with TLS and -save..."
        echo "Client command: ./nettest -c 127.0.0.1 -save -tls -git-hash ${{ github.sha }}"
        
        timeout 60s ./nettest -c 127.0.0.1 -save -tls -git-hash "${{ github.sha }}"
        CLIENT_EXIT_CODE=$?
        
        echo "Client test completed"
        echo "Client exit code: $CLIENT_EXIT_CODE"
        
        if [ $CLIENT_EXIT_CODE -ne 0 ]; then
          echo "❌ Client TLS test failed"
          exit 1
        fi
        
        echo "✅ Client TLS test completed successfully"
        
    - name: Run nettest client WS test
      run: |
        cd test-run
        
        echo "Running nettest client test with WS and -save..."
        echo "Client command: ./nettest -c 127.0.0.1 -save -ws -git-hash ${{ github.sha }}"
        
        timeout 60s ./nettest -c 127.0.0.1 -save -ws -git-hash "${{ github.sha }}"
        CLIENT_EXIT_CODE=$?
        
        echo "Client test completed"
        echo "Client exit code: $CLIENT_EXIT_CODE"
        
        if [ $CLIENT_EXIT_CODE -ne 0 ]; then
          echo "❌ Client WS test failed"
          exit 1
        fi
        
        echo "✅ Client WS test completed successfully"

    - name: Run nettest client WSS test
      run: |
        cd test-run
        
        echo "Running nettest client test with WSS and -save..."
        echo "Client command: ./nettest -c 127.0.0.1 -save -tls -ws -git-hash ${{ github.sha }}"
        
        timeout 60s ./nettest -c 127.0.0.1 -save -tls -ws -git-hash "${{ github.sha }}"
        CLIENT_EXIT_CODE=$?
        
        echo "Client test completed"
        echo "Client exit code: $CLIENT_EXIT_CODE"
        
        if [ $CLIENT_EXIT_CODE -ne 0 ]; then
          echo "❌ Client WSS test failed"
          exit 1
        fi
        
        echo "✅ Client WSS test completed successfully"
        
    - name: Run nettest client JSON test
      run: |
        cd test-run

        echo "Running nettest client test with -json..."
        echo "Client command: ./nettest -c 127.0.0.1 -json"

        # stdout has to carry the JSON document and nothing else,
        # so diagnostics are separated into a different file.
        timeout 60s ./nettest -c 127.0.0.1 -json > result.json 2> result.err
        CLIENT_EXIT_CODE=$?

        echo "Client exit code: $CLIENT_EXIT_CODE"
        echo "=== stdout ==="
        cat result.json
        echo "=== stderr ==="
        cat result.err

        if [ $CLIENT_EXIT_CODE -ne 0 ]; then
          echo "❌ Client JSON test failed"
          exit 1
        fi

        if ! python3 -m json.tool result.json > /dev/null; then
          echo "❌ Output on stdout is not valid JSON"
          exit 1
        fi

        python3 - <<'PY'
        import json
        import sys

        with open("result.json") as handle:
            document = json.load(handle)

        def require(condition, message):
            if not condition:
                print(f"❌ {message}")
                sys.exit(1)

        require(document["type"] == "measurement", "unexpected document type")
        require(document["client"]["name"] == "nettest", "unexpected client name")
        require(document["server"]["host"] == "127.0.0.1", "unexpected server host")
        require(document["protocol"] == "tcp", "unexpected protocol")
        require(document["ping"]["latency_ms"] >= 0, "missing ping latency")
        require(document["download"]["speed_bps"] > 0, "missing download speed")
        require(document["upload"]["speed_bps"] > 0, "missing upload speed")
        require(document["download"]["bytes_transferred"] > 0, "missing download volume")
        require(document["upload"]["bytes_transferred"] > 0, "missing upload volume")

        print("✅ JSON document contains every expected value")
        PY

        echo "✅ Client JSON test completed successfully"

    - name: Run nettest client raw test
      run: |
        cd test-run

        echo "Running nettest client test with -raw..."

        timeout 60s ./nettest -c 127.0.0.1 -raw > result.raw 2> raw.err
        CLIENT_EXIT_CODE=$?

        echo "Client exit code: $CLIENT_EXIT_CODE"
        echo "=== stdout ==="
        cat result.raw

        if [ $CLIENT_EXIT_CODE -ne 0 ]; then
          echo "❌ Client raw test failed"
          exit 1
        fi

        # The raw format is a single line of three numbers: ping/download/upload.
        if [ "$(wc -l < result.raw)" -ne 1 ]; then
          echo "❌ Raw output is not a single line"
          exit 1
        fi

        if ! grep -Eq '^[0-9]+\.[0-9]+/[0-9]+\.[0-9]+/[0-9]+\.[0-9]+$' result.raw; then
          echo "❌ Raw output is not parseable"
          exit 1
        fi

        echo "✅ Client raw test completed successfully"

    - name: Test completed
      run: |
        echo "✅ All tests completed successfully"
        echo "Results have been saved to the control server"
        
    - name: Test summary
      run: |
        echo "=== TEST SUMMARY ==="
        echo "✅ Build: Completed successfully"
        echo "✅ TLS Server: Started and listening on port 5005"
        echo "✅ Client TLS: Test executed with -save -tls"
        echo "✅ Client WSS: Test executed with -save -ws -tls"
        echo "✅ Results: Saved to control server"
        echo "=== END TEST SUMMARY ==="
