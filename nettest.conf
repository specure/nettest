# Nettest Configuration File
# This file contains default configuration values for the nettest application

# Server-specific settings
server_tcp_port = 5005
server_workers = 30
server_udp_port = 5004

# Browser QoS (jitter / packet loss) over WebTransport, i.e. QUIC datagrams on
# their own UDP port. Browsers have no UDP socket, so this is the only transport
# where loss stays visible; over the control WebSocket TCP hides it.
# With cert_path/key_path set the endpoint serves that certificate; otherwise it
# self-signs and publishes the certificate hash, which browsers accept through
# `serverCertificateHashes` (handy for local development).
enable_webtransport = true
server_wt_port = 5006


# Client-specific settings
client_use_tls=false
client_use_websocket=false
signed_result = false
# Maximum chunk size in bytes (default: 4194304 = 4MB)
max_chunk_size = 4194304

# Control server settings
x_nettest_client = "nt"
control_server = "https://api.nettest.org"

# Client UUID for measurement saving
# Will be auto-generated if empty, format: client_uuid = "uuid-here"
# client_uuid = "" 

#TLS settings
# server_tls_port = 443
# cert_path = ""
# key_path = ""

# User and daemon settings
# user = ""
daemonize = false

#encryption_key = ""
# Logging settings info/debug/trace 
# logger = "info"

#auto-registration settings
server_registration = false
# registration_token = ""
# hostname = ""

# Local network discovery and browser client (both on by default).
# mDNS announces the server as nettest.local so clients find it without an address.
enable_mdns = true
# Serves the browser speed test on the measurement port: open http://<server-ip>:5005/
# on any device in the network. Plain HTTP is enough for ping, download and upload.
enable_web_ui = true





