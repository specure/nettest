<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nettest — browser RMBTws PoC</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font: inherit; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
    .cards { display: flex; gap: 12px; margin: 16px 0; }
    .card { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .card .label { color: #888; font-size: 12px; }
    .card .val { font-size: 22px; font-weight: 600; }
    #bar { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
    #bar > div { height: 100%; width: 0; background: #2196f3; transition: width .1s; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 8px; height: 220px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>nettest — browser RMBTws PoC <small>(greeting · ping · download)</small></h1>
  <p style="color:#888">Jitter / packet-loss are UDP-only and skipped in the browser.</p>
  <div class="row">
    <input id="url" value="wss://localhost:5443" />
    <button id="run">Run</button>
  </div>
  <div class="cards">
    <div class="card"><div class="label">Ping</div><div class="val" id="ping">—</div></div>
    <div class="card"><div class="label">Download</div><div class="val" id="dl">—</div></div>
  </div>
  <div id="bar"><div></div></div>
  <pre id="log"></pre>

  <script type="module">
    import { runMeasurement } from './rmbt-ws.js';
    const $ = (id) => document.getElementById(id);
    const logEl = $('log');
    const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

    $('run').onclick = async () => {
      $('run').disabled = true;
      $('ping').textContent = '—'; $('dl').textContent = '—';
      logEl.textContent = '';
      try {
        await runMeasurement($('url').value, {
          log,
          ping: (ms) => { $('ping').textContent = ms.toFixed(1) + ' ms'; },
          download: (mbps) => { $('dl').textContent = mbps.toFixed(1) + ' Mbit/s'; $('bar').firstElementChild.style.width = '100%'; },
          onProgress: (bytes, secs) => {
            if (secs > 0) $('dl').textContent = ((bytes * 8) / secs / 1e6).toFixed(0) + ' Mbit/s';
            $('bar').firstElementChild.style.width = Math.min(100, secs / 2 * 100) + '%';
          },
        });
      } catch (e) {
        log('FAILED: ' + e.message);
      } finally {
        $('run').disabled = false;
      }
    };
  </script>
</body>
</html>
