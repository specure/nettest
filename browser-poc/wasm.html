<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nettest — WASM RMBTws PoC</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .tag { display:inline-block; background:#673ab7; color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; vertical-align:middle; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font: inherit; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
    .cards { display: flex; gap: 12px; margin: 16px 0; }
    .card { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .card .label { color: #888; font-size: 12px; }
    .card .val { font-size: 22px; font-weight: 600; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 8px; height: 220px; overflow: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>nettest — WASM RMBTws PoC <span class="tag">Rust/wasm</span></h1>
  <p style="color:#888">The protocol (greeting · ping · download) runs in <b>Rust compiled to wasm</b>; JS only holds the WebSocket. Jitter / packet-loss (UDP) skipped.</p>
  <div class="row">
    <input id="url" value="wss://localhost:5443" />
    <button id="run" disabled>Loading wasm…</button>
  </div>
  <div class="cards">
    <div class="card"><div class="label">Ping</div><div class="val" id="ping">—</div></div>
    <div class="card"><div class="label">Download</div><div class="val" id="dl">—</div></div>
  </div>
  <pre id="log"></pre>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    const logEl = $('log');
    const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

    // Surface any error on the page (not just the console).
    window.addEventListener('error', (e) => log('JS error: ' + (e.message || e)));
    window.addEventListener('unhandledrejection', (e) => log('promise rejected: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

    log('page loaded, importing wasm…');
    let run_measurement;
    try {
      const mod = await import('./pkg/nettest.js');
      await mod.default();            // init()
      run_measurement = mod.run_measurement;
      $('run').disabled = false;
      $('run').textContent = 'Run';
      log('wasm module loaded ✓');
    } catch (e) {
      log('WASM LOAD FAILED: ' + (e && e.message ? e.message : e));
    }

    $('run').onclick = async () => {
      if (!run_measurement) { log('wasm not loaded'); return; }
      $('run').disabled = true;
      $('ping').textContent = '—'; $('dl').textContent = '—';
      logEl.textContent = 'wasm module loaded\n';
      try {
        const r = await run_measurement($('url').value, (msg) => {
          log(msg);
          if (msg.startsWith('ping:')) $('ping').textContent = msg.slice(5).trim();
          if (msg.startsWith('download:')) $('dl').textContent = msg.slice(9).trim().split(' (')[0];
        });
        log('result: ' + JSON.stringify(r));
      } catch (e) {
        log('FAILED: ' + (e && e.message ? e.message : e));
      } finally {
        $('run').disabled = false;
      }
    };
  </script>
</body>
</html>
